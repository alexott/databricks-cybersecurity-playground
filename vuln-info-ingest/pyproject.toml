[tool.poetry]
name = "vuln-info-ingest"
version = "0.1.0"
description = "Ingestion of vulnerability data (CVE v5, GHSA, OSV, CISA KEV, FIRST EPSS, MITRE CWE, MITRE ATT&CK, MITRE ATLAS) into Databricks."
authors = ["Alex Ott <alexott@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"

[tool.poetry.group.test.dependencies]
pytest = "^9.0.3"
pytest-spark = "^0.8.0"
pyspark = ">=4.0.1"
pyyaml = ">=6.0"

# Python code for `databricks bundle validate/deploy` (the genie_agent_retarget mutator)
[tool.poetry.group.bundle.dependencies]
databricks-bundles = "1.24.0"
pydabs-genie-agent-retarget = ">=0.1.2"
