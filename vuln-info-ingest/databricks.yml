# Databricks Asset Bundle for ingestion of vulnerability data (CVE v5, GHSA, OSV, CISA KEV, FIRST EPSS, MITRE CWE, MITRE ATT&CK, MITRE ATLAS).
# See README.md for deployment instructions.
bundle:
  name: vuln_info_ingest
  engine: direct

python:
  venv_path: .venv
  resources:
    # The Genie space, only with --var genie=true.
    - 'resources_py:load_resources'
  mutators:
    # The Genie space file uses the lw-field table names; this rewrites them with genie_table_mapping.
    - 'genie_agent_retarget:retarget_genie_spaces'

include:
  - resources/*.yml

sync:
  exclude:
    - tests/**
    - .venv/**
    - genie/**
    - resources_py/**
    - "**/__pycache__/**"

targets:
  dev:
    # Resources are prefixed with '[dev <user>]'. Schedules set pause_status explicitly,
    # so development mode doesn't pause them: pause them here.
    mode: development
    default: true
    variables:
      catalog: cybersecurity
      schema: datasets
      pause_status: PAUSED

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: cybersecurity
      schema: datasets
