resources:
  jobs:
    vuln_cwe_capec_attack:
      name: vuln_cwe_capec_attack
      description: One-time build of the cwe_capec_attack edge table (CWE -> CAPEC -> ATT&CK); safe to re-run
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: capec_url
          default: https://capec.mitre.org/data/xml/capec_latest.xml
        - name: attack_url
          # Pinned ATT&CK version; keep it in sync with other users of ATT&CK data.
          default: https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack-19.1.json
      tasks:
        - task_key: build
          notebook_task:
            notebook_path: "../src/capec/Build cwe_capec_attack.py"
