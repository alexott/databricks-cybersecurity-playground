variables:
  catalog:
    description: Catalog for all tables and the scratch Volume
  schema:
    description: Schema for all tables and the scratch Volume
  volume:
    description: Scratch Volume (created if missing) for staging files and streaming checkpoints
    default: reference
  schedule:
    description: Default Quartz cron schedule of the periodic jobs
    default: "0 0 */6 * * ?"
  cve_v5_schedule:
    description: Schedule of the CVE v5 job
    default: ${var.schedule}
  ghsa_schedule:
    description: Schedule of the GHSA job
    default: ${var.schedule}
  osv_schedule:
    description: Schedule of the OSV job
    default: ${var.schedule}
  kev_schedule:
    description: Schedule of the KEV job
    default: ${var.schedule}
  epss_schedule:
    description: Schedule of the EPSS job (scores are published daily around 13:30 UTC)
    default: "0 0 15 * * ?"
  cwe_schedule:
    description: Schedule of the CWE job (the catalog is released a few times a year)
    default: "0 0 4 ? * MON"
  attack_version:
    description: ATT&CK version of the ATT&CK and cwe_capec_attack jobs, 'latest' or e.g. '19.1'
    default: latest
  attack_schedule:
    description: Schedule of the ATT&CK job (ATT&CK is released about twice a year)
    default: "0 30 4 ? * MON"
  timezone:
    description: Time zone of the schedules
    default: UTC
  pause_status:
    description: PAUSED or UNPAUSED (the dev target sets PAUSED)
    default: UNPAUSED
